# ~/.config/picom/picom.conf
# "Dusk Tide" - picom config for i3, matched to a dark indigo seascape wallpaper
# Requires picom >= 12 (built-in animations):  sudo pacman -S picom
# Run with:  picom --config ~/.config/picom/picom.conf

#################################
#            Backend            #
#################################
backend = "glx";
vsync = true;
use-damage = true;
# NVIDIA: if you get flicker/tearing, set use-damage = false

#################################
#           Corners             #
#################################
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3-frame'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'"
];

#################################
#            Shadows            #
#################################
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.55;
shadow-offset-x = -20;
shadow-offset-y = -14;
# deep indigo shadow instead of pure black
shadow-red = 0.04;
shadow-green = 0.05;
shadow-blue = 0.16;

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@"
];

#################################
#             Fading            #
#################################
fading = false;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

#################################
#          Transparency         #
#################################
inactive-opacity = 0.90;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# per-app opacity (terminals look best slightly see-through over blur)
opacity-rule = [
  "92:class_g = 'kitty'",
  "92:class_g = 'Alacritty'",
  "92:class_g = 'foot'",
  "88:class_g = 'Rofi'",
  "100:class_g = 'firefox'",
  "100:class_g = 'mpv'",
  "100:fullscreen"
];

#################################
#              Blur             #
#################################
blur: {
  method = "dual_kawase";
  strength = 7;
  deviation = 1.0;
  background = false;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@"
];

#################################
#           Animations          #
#################################
# Hyprland-ish feel: quick pop-in with a soft overshoot, snappy close,
# smooth window resize/move.
animations = (
  { triggers = ["open"];     preset = "appear";          scale = 0.88; duration = 0.28; },
  { triggers = ["close"];    preset = "disappear";       scale = 0.88; duration = 0.2;  },
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.25; },
  {
    triggers = ["hide"];
    opacity = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.25;
      start = "window-raw-opacity";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },
  {
    triggers = ["show"];
    opacity = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.25;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  }
);

#################################
#            General            #
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;
unredir-if-possible = false;
log-level = "warn";

wintypes: {
  tooltip       = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
