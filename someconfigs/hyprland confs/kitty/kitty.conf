#  ╔══════════════════════════════════════════════════════╗
#  ║  Kitty Config — "Grey Tide"                         ║
#  ║  Stormy dusk — mountains across a dark sea  ║
#  ╚══════════════════════════════════════════════════════╝

# ══════════════════════
#         Font
# ══════════════════════
font_family      family="JetBrainsMono Nerd Font" features="+calt +liga +ss01"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10
adjust_line_height 108%
adjust_column_width 100%
disable_ligatures never
symbol_map U+E5FA-U+E6B7,U+E700-U+E7C5,U+F000-U+F2E0,U+E200-U+E2A9,U+F400-U+F4A8,U+2665,U+26A1 JetBrainsMono Nerd Font

# ══════════════════════
#        Cursor
# ══════════════════════
cursor_shape             beam
cursor_beam_thickness    1.5
cursor_blink_interval    0.5
cursor_stop_blinking_after 15
cursor_trail             1
cursor_trail_decay       0.1 0.4

# ══════════════════════
#     Window feel
# ══════════════════════
window_padding_width        14
window_margin_width         0
window_border_width         1pt
draw_minimal_borders        yes
single_window_margin_width  0
background_opacity          0.75
dynamic_background_opacity  yes
confirm_os_window_close     0
hide_window_decorations     no
placement_strategy          center
inactive_text_alpha         0.7
background_blur 50
# On Hyprland, prefer a windowrule for blur over kitty's own settings, e.g.
# windowrulev2 = blur, class:^(kitty)$
# background_opacity below still works standalone (compositor-independent).

# ══════════════════════
#         Tabs
# ══════════════════════
tab_bar_edge              bottom
tab_bar_style              powerline
tab_powerline_style        angled
tab_bar_min_tabs           1
tab_bar_margin_width       6
tab_bar_margin_height      4 0
tab_title_template         " {index} {title} "
active_tab_font_style      bold
inactive_tab_font_style    normal

# ══════════════════════
#   Scrollback / Bell
# ══════════════════════
scrollback_lines      10000
scrollback_pager_history_size 128
enable_audio_bell      no
visual_bell_duration    0.15
window_alert_on_bell    yes
bell_on_tab             yes

# ══════════════════════
#    Mouse & Links
# ══════════════════════
mouse_hide_wait          3.0
url_style                 curly
detect_urls               yes
copy_on_select             yes
strip_trailing_spaces      smart

# ══════════════════════
#   Performance / Misc
# ══════════════════════
repaint_delay            8
input_delay               3
sync_to_monitor            yes
shell_integration           enabled
allow_remote_control        yes
update_check_interval        0
close_on_child_death          no
remember_window_size          yes
initial_window_width          1000
initial_window_height          650
enabled_layouts               tall,fat,grid,splits,stack
resize_in_steps               yes

# ══════════════════════
#          Colors
#   Deep saturated blue dusk — "Grey Tide"
# ══════════════════════
foreground             #c7c9d9
background              #0d0e16
selection_foreground    #0d0e16
selection_background    #5a638a

cursor                   #8089b3
cursor_text_color        #0d0e16

url_color                #9aa0c2

# black
color0  #0d0e16
color8  #363a4f

# red — the tiny aviation warning lights on the towers
color1  #7a5a66
color9  #9c7686

# green
color2  #5f6e5f
color10 #7f907f

# yellow
color3  #8a7a5a
color11 #ab9875

# blue
color4  #5a638a
color12 #8089b3

# magenta
color5  #6a5f8a
color13 #8f82b3

# cyan
color6  #5f7a8a
color14 #82a0b3

# white
color7  #8f93ad
color15 #d6d8e8

# window border colors — echo the palette instead of default gray
active_border_color     #5a638a
inactive_border_color   #1c1e2b
bell_border_color        #8a7a5a

# tab bar colors
active_tab_background    #5a638a
active_tab_foreground    #0d0e16
inactive_tab_background  #15161f
inactive_tab_foreground  #4a4d61
tab_bar_background       #0d0e16

# marks (useful for scrollback_pager searches)
mark1_foreground #0d0e16
mark1_background #8089b3

# ══════════════════════
#       Keybinds
# ══════════════════════
# windows / tabs
map ctrl+shift+enter      new_window
map ctrl+shift+t          new_tab
map ctrl+shift+w          close_window
map ctrl+shift+equal      change_font_size all +1.0
map ctrl+shift+minus      change_font_size all -1.0
map ctrl+shift+backspace  change_font_size all 0

# split navigation (works well with enabled splits layout)
map ctrl+shift+right      neighboring_window right
map ctrl+shift+left       neighboring_window left
map ctrl+shift+up         neighboring_window up
map ctrl+shift+down       neighboring_window down
map ctrl+shift+f5         next_layout

# quick tab switching
map ctrl+shift+]          next_tab
map ctrl+shift+[          previous_tab
map ctrl+shift+l          next_tab
map ctrl+shift+h          previous_tab

# scrollback search
map ctrl+shift+f          show_scrollback
map ctrl+shift+g          launch --stdin-source=@screen_scrollback --stdin-add-formatting sh -c "less -R +G"

# quick clear
map ctrl+shift+k          combine : clear_terminal scroll active : send_text normal,application \x0c
