; light visualizer feed: drives the little equalizer in the bar while a song plays.
; 10 bars (must be even: stereo) at 15 fps — cheap on purpose.
[general]
bars = 10
framerate = 15

[input]
; fed by firefox-cava.sh (Firefox's audio only) through this fifo
method = fifo
source = @FIFO@
sample_rate = 44100
sample_bits = 16

[smoothing]
noise_reduction = 65
monstercat = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
