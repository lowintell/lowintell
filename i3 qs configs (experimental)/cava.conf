; the one visualizer feed (shared by the popup bars and the bar equalizer), runs while a song plays
[general]
bars = 20
framerate = 25

[input]
; fed by firefox-cava.sh (Firefox's audio only) through this fifo
method = fifo
source = @FIFO@
sample_rate = 44100
sample_bits = 16

[smoothing]
noise_reduction = 55
monstercat = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
