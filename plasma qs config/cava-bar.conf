; lightweight cava config used while only the little bar equalizer is visible
; (popup closed): 10 bars (must be even: stereo), 15 fps -> far fewer frames to parse and redraw.
; shell.qml switches to cava.conf (20 bars, 25 fps) while the popup is open.
[general]
bars = 10
framerate = 15

[input]
method = pulse
source = auto

[smoothing]
noise_reduction = 65
monstercat = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
