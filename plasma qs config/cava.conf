; cava config used by shell.qml — streams bar heights (0-100) to stdout
[general]
bars = 20
framerate = 25

[input]
method = pulse
source = auto

[smoothing]
noise_reduction = 65
monstercat = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
